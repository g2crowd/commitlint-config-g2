# Disable install scripts by default - mitigates Shai-Hulud-style worms
# spreading via postinstall. This package's deps have no native/build
# dependencies that need them.
enableScripts: false

nodeLinker: node-modules

npmMinimalAgeGate: 7d

npmPreapprovedPackages:
  - "@g2crowd/*"

yarnPath: .yarn/releases/yarn-4.18.1.cjs
